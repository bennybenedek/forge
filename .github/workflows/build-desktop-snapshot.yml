name: Build Desktop Snapshot (Fork-Friendly)

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled'
        required: false
        default: false
  push:
    branches:
      - master
      - rogueCommander

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.read_version.outputs.version }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install virtual framebuffer (if not available) to allow running GUI on a headless server
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt install -y xvfb; }

      - name: Configure Git User
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Build Desktop Distribution
        run: |
          export DISPLAY=":1"
          Xvfb :1 -screen 0 800x600x8 &
          mvn -U -B clean -P windows-linux install -T 1C
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Prepare artifacts for upload
        run: |
          mkdir artifacts
          # Copy distribution files
          cp forge-installer/target/*.tar.bz2 artifacts/ || true
          cp forge-installer/target/*.jar artifacts/ || true
          cp forge-gui-desktop/target/classes/build.txt artifacts/ || true
          cp forge-gui-desktop/target/classes/version.txt artifacts/ || true
          # List what we got
          ls -lh artifacts/

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Rename JAR with version (Rogue Commander only)
        if: github.ref == 'refs/heads/rogueCommander'
        run: |
          # Get version from version.txt (e.g., "2.0.09-SNAPSHOT-12.25")
          VERSION=$(cat artifacts/version.txt)
          # Rename the JAR to include the version
          mv artifacts/forge-installer-*.jar artifacts/forge-installer-${VERSION}.jar || true
          echo "Renamed JAR to: forge-installer-${VERSION}.jar"
          ls -lh artifacts/

      - name: Read version for downstream jobs
        id: read_version
        if: github.ref == 'refs/heads/rogueCommander'
        run: |
          VERSION=$(cat artifacts/version.txt)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Prepare Rogue Commander release assets
        if: github.ref == 'refs/heads/rogueCommander'
        run: |
          mkdir release-artifacts
          cp artifacts/*.jar release-artifacts/ || true
          cp artifacts/*.tar.bz2 release-artifacts/ || true
          cp artifacts/build.txt release-artifacts/ || true
          cp artifacts/version.txt release-artifacts/ || true
          ls -lh release-artifacts/

      - name: Upload artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: forge-desktop-snapshot-${{ steps.date.outputs.date }}
          path: artifacts/*
          retention-days: 30

      - name: Create or Update Release (Master)
        if: github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          name: Desktop Snapshot - ${{ steps.date.outputs.date }}
          tag: desktop-snapshot-latest
          prerelease: true
          artifacts: artifacts/*
          allowUpdates: true
          removeArtifacts: true
          body: |
            Automated desktop build from master branch
            Build date: ${{ steps.date.outputs.date }}
            Commit: ${{ github.sha }}

            Download the `.tar.bz2` file for a complete distribution with all resources.

      - name: Create or Update Release (Rogue Commander)
        if: github.ref == 'refs/heads/rogueCommander'
        uses: ncipollo/release-action@v1
        with:
          name: Rogue Commander - ${{ steps.date.outputs.date }}
          tag: rogue-commander-latest
          prerelease: true
          artifacts: release-artifacts/*
          allowUpdates: true
          removeArtifacts: true
          body: |
            🎮 **Rogue Commander Playtest Build**

            Automated build from rogueCommander branch
            Build date: ${{ steps.date.outputs.date }}
            Commit: ${{ github.sha }}

            **Download Instructions:**

            **Windows (recommended — no Java required):**
            Download `forge-rogue-commander.msi` and double-click it. Java is bundled — no separate installation needed.
            After installation, launch `forge.exe` from the install folder.

            **All platforms (Java 17 required):**
            1. Ensure you have Java 17 or later installed. You can download it from [Adoptium](https://adoptium.net/de/temurin/releases?version=17&os=any&arch=any).
            2. Download the `forge-installer-*.jar` file below.
            3. Run the installer:
               - Windows: Double-click the `.jar` file. If that does not work, run `java -jar forge-installer-*.jar` in PowerShell.
               - macOS: Right-click → Open (required to bypass Gatekeeper), or run `java -jar forge-installer-*.jar` in Terminal.
               - Linux: Run `java -jar forge-installer-*.jar` in Terminal.
            4. Choose an install folder and let the installer unpack all required files for you.
            5. Launch Forge from the installed folder:
               - Windows: `forge.exe`
               - macOS/Linux: `./forge.sh`
            6. In the main menu (left side), select "Rogue Commander" and click "Start New Run" to begin the game mode.

            This is a development build for playtesting the new Rogue Commander game mode, which is still a work in progress.
            For general information on how to use the Forge app and gameplay basics, see the [official Forge User Guide](https://github.com/Card-Forge/forge/wiki/User-Guide#gameplay).

  build-windows-msi:
    needs: [build]
    if: github.ref == 'refs/heads/rogueCommander'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download Forge distribution from release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          Write-Host "Downloading tar.bz2 from rogue-commander-latest release..."
          gh release download rogue-commander-latest --pattern "*.tar.bz2" --dir .
          $tarball = Get-ChildItem "*.tar.bz2" | Select-Object -First 1
          if (-not $tarball) { throw "No tar.bz2 found in release" }
          Write-Host "Downloaded: $($tarball.Name) ($([math]::Round($tarball.Length / 1MB, 1)) MB)"

          Write-Host "Extracting to staging directory..."
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          tar -xjf $tarball.Name -C staging
          Write-Host "Extracted. Contents:"
          Get-ChildItem staging | ForEach-Object { Write-Host "  $($_.Name)" }

          # If tar.bz2 has a single top-level directory, move contents up
          $dirs = Get-ChildItem staging -Directory
          $files = Get-ChildItem staging -File
          if ($dirs.Count -eq 1 -and $files.Count -eq 0) {
            Write-Host "Unwrapping single top-level directory: $($dirs[0].Name)"
            Get-ChildItem $dirs[0].FullName | Move-Item -Destination staging
            Remove-Item $dirs[0].FullName
          }

          # Verify forge.exe exists
          if (-not (Test-Path "staging\forge.exe")) { throw "forge.exe not found in staging" }
          Write-Host "Forge distribution ready."

      - name: Download Temurin 17 JRE (Windows x64)
        shell: pwsh
        run: |
          $jreUrl = "https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jre/hotspot/normal/eclipse"
          Write-Host "Downloading Temurin 17 JRE from Adoptium..."
          Invoke-WebRequest -Uri $jreUrl -OutFile jre.zip -UseBasicParsing
          Write-Host "Download complete. Extracting..."
          Expand-Archive -Path jre.zip -DestinationPath jre-raw
          $extracted = Get-ChildItem jre-raw | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          Write-Host "Extracted folder: $($extracted.Name)"
          # Move JRE into staging as jre17 subfolder (matches Launch4j <path>jre17</path>)
          Move-Item $extracted.FullName "staging\jre17"
          if (-not (Test-Path "staging\jre17\bin\java.exe")) { throw "java.exe not found" }
          $jreSize = [math]::Round((Get-ChildItem "staging\jre17" -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "JRE added to staging\jre17 ($jreSize MB)"

      - name: Build MSI with WiX v3
        shell: pwsh
        env:
          FORGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $wixBin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (-not (Test-Path "$wixBin\candle.exe")) {
            # Fallback: try v3.11
            $wixBin = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          }
          if (-not (Test-Path "$wixBin\candle.exe")) { throw "WiX Toolset not found on runner" }
          Write-Host "Using WiX at: $wixBin"

          $version = $env:FORGE_VERSION
          # WiX requires X.Y.Z.W format — extract digits only
          $parts = ($version -replace '[^0-9.]','').Split('.') | Where-Object { $_ -ne '' }
          while ($parts.Count -lt 4) { $parts += '0' }
          $msiVersion = ($parts[0..3]) -join '.'
          Write-Host "Version: $version -> MSI version: $msiVersion"

          # Step 1: Harvest staging directory into WiX fragment
          Write-Host "Harvesting files with heat.exe..."
          & "$wixBin\heat.exe" dir staging `
            -cg ForgeFiles -dr INSTALLDIR -srd -ag -sfrag `
            -var var.SourceDir -sw5150 `
            -template fragment -out files.wxs
          if ($LASTEXITCODE -ne 0) { throw "heat.exe failed: $LASTEXITCODE" }
          Write-Host "Generated files.wxs"

          # Step 2: Write product.wxs
          $productWxs = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*"
                     Name="Forge Rogue Commander"
                     Language="1033"
                     Codepage="65001"
                     Version="$msiVersion"
                     Manufacturer="Forge Developers"
                     UpgradeCode="B7E3F1A2-9C4D-4E5F-8A6B-1234567890AB">
              <Package InstallerVersion="500" Compressed="yes" InstallPrivileges="limited" />
              <MajorUpgrade DowngradeErrorMessage="A newer version of Forge Rogue Commander is already installed." />
              <MediaTemplate EmbedCab="yes" CompressionLevel="high" />

              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="LocalAppDataFolder">
                  <Directory Id="INSTALLDIR" Name="ForgeRogueCommander" />
                </Directory>
              </Directory>

              <Feature Id="MainFeature" Title="Forge Rogue Commander" Level="1">
                <ComponentGroupRef Id="ForgeFiles" />
              </Feature>

              <UIRef Id="WixUI_InstallDir" />
              <Property Id="WIXUI_INSTALLDIR" Value="INSTALLDIR" />
            </Product>
          </Wix>
          "@
          [System.IO.File]::WriteAllText("$PWD\product.wxs", $productWxs, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Generated product.wxs"

          # Step 3: Compile
          Write-Host "Compiling with candle.exe..."
          & "$wixBin\candle.exe" product.wxs files.wxs -dSourceDir=staging
          if ($LASTEXITCODE -ne 0) { throw "candle.exe failed: $LASTEXITCODE" }

          # Step 4: Link
          Write-Host "Linking with light.exe..."
          & "$wixBin\light.exe" product.wixobj files.wixobj `
            -ext WixUIExtension -o forge-rogue-commander.msi -spdb `
            -sice:ICE38 -sice:ICE43 -sice:ICE57 -sice:ICE64 -sice:ICE91
          if ($LASTEXITCODE -ne 0) { throw "light.exe failed: $LASTEXITCODE" }

          if (-not (Test-Path "forge-rogue-commander.msi")) { throw "MSI not produced" }
          $mb = [math]::Round((Get-Item "forge-rogue-commander.msi").Length / 1MB, 1)
          Write-Host "forge-rogue-commander.msi produced ($mb MB)"

      - name: Upload MSI to Rogue Commander release
        uses: ncipollo/release-action@v1
        with:
          tag: rogue-commander-latest
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          removeArtifacts: false
          artifacts: forge-rogue-commander.msi
          token: ${{ secrets.GITHUB_TOKEN }}
