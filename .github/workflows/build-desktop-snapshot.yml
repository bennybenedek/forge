name: Build Desktop Snapshot (Fork-Friendly)

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled'
        required: false
        default: false
  push:
    branches:
      - master
      - rogueCommander

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install virtual framebuffer (if not available) to allow running GUI on a headless server
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt install -y xvfb; }

      - name: Configure Git User
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Build Desktop Distribution
        run: |
          export DISPLAY=":1"
          Xvfb :1 -screen 0 800x600x8 &
          mvn -U -B clean -P windows-linux install -T 1C
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Prepare artifacts for upload
        run: |
          mkdir artifacts
          # Copy distribution files
          cp forge-installer/target/*.tar.bz2 artifacts/ || true
          cp forge-installer/target/*.jar artifacts/ || true
          cp forge-gui-desktop/target/classes/build.txt artifacts/ || true
          cp forge-gui-desktop/target/classes/version.txt artifacts/ || true
          # List what we got
          ls -lh artifacts/

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Rename JAR with version (Rogue Commander only)
        if: github.ref == 'refs/heads/rogueCommander'
        run: |
          # Get version from version.txt (e.g., "2.0.09-SNAPSHOT-12.25")
          VERSION=$(cat artifacts/version.txt)
          # Rename the JAR to include the version
          mv artifacts/forge-installer-*.jar artifacts/forge-installer-${VERSION}.jar || true
          echo "Renamed JAR to: forge-installer-${VERSION}.jar"
          ls -lh artifacts/

      - name: Prepare Rogue Commander release assets
        if: github.ref == 'refs/heads/rogueCommander'
        run: |
          mkdir release-artifacts
          cp artifacts/*.jar release-artifacts/ || true
          cp artifacts/build.txt release-artifacts/ || true
          cp artifacts/version.txt release-artifacts/ || true
          ls -lh release-artifacts/

      - name: Upload artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: forge-desktop-snapshot-${{ steps.date.outputs.date }}
          path: artifacts/*
          retention-days: 30

      - name: Create or Update Release (Master)
        if: github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          name: Desktop Snapshot - ${{ steps.date.outputs.date }}
          tag: desktop-snapshot-latest
          prerelease: true
          artifacts: artifacts/*
          allowUpdates: true
          removeArtifacts: true
          body: |
            Automated desktop build from master branch
            Build date: ${{ steps.date.outputs.date }}
            Commit: ${{ github.sha }}

            Download the `.tar.bz2` file for a complete distribution with all resources.

      - name: Create or Update Release (Rogue Commander)
        if: github.ref == 'refs/heads/rogueCommander'
        uses: ncipollo/release-action@v1
        with:
          name: Rogue Commander - ${{ steps.date.outputs.date }}
          tag: rogue-commander-latest
          prerelease: true
          artifacts: release-artifacts/*
          allowUpdates: true
          removeArtifacts: true
          body: |
            🎮 **Rogue Commander Playtest Build**

            Automated build from rogueCommander branch
            Build date: ${{ steps.date.outputs.date }}
            Commit: ${{ github.sha }}

            **Download Instructions:**
            1. Java Requirement: Ensure you have Java 17 or later installed. You can download it from [Adoptium](https://adoptium.net/de/temurin/releases?version=17&os=any&arch=any).
            2. Download the `forge-installer-*.jar` file below.
            3. Run the installer:
               - Windows: Double-click the `.jar` file. If that does not work, run `java -jar forge-installer-*.jar` in PowerShell.
               - macOS/Linux: Run `java -jar forge-installer-*.jar` in Terminal.
            4. Choose an install folder and let the installer unpack all required files for you.
            5. Launch Forge from the installed folder:
               - Windows: `forge.exe`
               - macOS/Linux: `./forge.sh`
            6. In the main menu (left side), select "Rogue Commander" and click "Start New Run" to begin the game mode.

            The `.tar.bz2` archive is still produced by CI as a manual fallback, but the installer `.jar` is the recommended one-file download.

            This is a development build for playtesting the new Rogue Commander game mode, which is still a work in progress.   
            For general information on how to use the Forge app and gameplay basics, see the [official Forge User Guide](https://github.com/Card-Forge/forge/wiki/User-Guide#gameplay).
