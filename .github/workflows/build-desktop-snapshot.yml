name: Build Desktop Snapshot (Fork-Friendly)

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled'
        required: false
        default: false
  push:
    branches:
      - master
      - rogueCommander

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.read_version.outputs.version }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install virtual framebuffer (if not available) to allow running GUI on a headless server
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt install -y xvfb; }

      - name: Configure Git User
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Build Desktop Distribution
        run: |
          export DISPLAY=":1"
          Xvfb :1 -screen 0 800x600x8 &
          mvn -U -B clean -P windows-linux install -T 1C
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Prepare artifacts for upload
        run: |
          mkdir artifacts
          # Copy distribution files
          cp forge-installer/target/*.tar.bz2 artifacts/ || true
          cp forge-installer/target/*.jar artifacts/ || true
          cp forge-gui-desktop/target/classes/build.txt artifacts/ || true
          cp forge-gui-desktop/target/classes/version.txt artifacts/ || true
          # List what we got
          ls -lh artifacts/

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Rename JAR with version (Rogue Commander only)
        if: github.ref == 'refs/heads/rogueCommander'
        run: |
          # Get version from version.txt (e.g., "2.0.09-SNAPSHOT-12.25")
          VERSION=$(cat artifacts/version.txt)
          # Rename the JAR to include the version
          mv artifacts/forge-installer-*.jar artifacts/forge-installer-${VERSION}.jar || true
          echo "Renamed JAR to: forge-installer-${VERSION}.jar"
          ls -lh artifacts/

      - name: Read version for downstream jobs
        id: read_version
        if: github.ref == 'refs/heads/rogueCommander'
        run: |
          VERSION=$(cat artifacts/version.txt)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Prepare Rogue Commander release assets
        if: github.ref == 'refs/heads/rogueCommander'
        run: |
          mkdir release-artifacts
          cp artifacts/*.jar release-artifacts/ || true
          cp artifacts/*.tar.bz2 release-artifacts/ || true
          cp artifacts/build.txt release-artifacts/ || true
          cp artifacts/version.txt release-artifacts/ || true
          ls -lh release-artifacts/

      - name: Upload artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: forge-desktop-snapshot-${{ steps.date.outputs.date }}
          path: artifacts/*
          retention-days: 30

      - name: Create or Update Release (Master)
        if: github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          name: Desktop Snapshot - ${{ steps.date.outputs.date }}
          tag: desktop-snapshot-latest
          prerelease: true
          artifacts: artifacts/*
          allowUpdates: true
          removeArtifacts: true
          body: |
            Automated desktop build from master branch
            Build date: ${{ steps.date.outputs.date }}
            Commit: ${{ github.sha }}

            Download the `.tar.bz2` file for a complete distribution with all resources.

      - name: Create or Update Release (Rogue Commander)
        if: github.ref == 'refs/heads/rogueCommander'
        uses: ncipollo/release-action@v1
        with:
          name: Rogue Commander - ${{ steps.date.outputs.date }}
          tag: rogue-commander-latest
          prerelease: true
          artifacts: release-artifacts/*
          allowUpdates: true
          removeArtifacts: true
          body: |
            🎮 **Rogue Commander Playtest Build**

            Automated build from rogueCommander branch
            Build date: ${{ steps.date.outputs.date }}
            Commit: ${{ github.sha }}

            **Download Instructions:**

            **Windows (recommended):**
            Download `forge-rogue-commander-setup.exe` and double-click it. It will automatically download and launch the Forge installer for you. No Java required for installation — but Java 17 is still needed to run Forge afterwards (the installer will guide you if it is missing).

            **All platforms (Java required):**
            1. Java Requirement: Ensure you have Java 17 or later installed. You can download it from [Adoptium](https://adoptium.net/de/temurin/releases?version=17&os=any&arch=any).
            2. Download the `forge-installer-*.jar` file below.
            3. Run the installer:
               - Windows: Double-click the `.jar` file. If that does not work, run `java -jar forge-installer-*.jar` in PowerShell.
               - macOS: Right-click → Open (required to bypass Gatekeeper), or run `java -jar forge-installer-*.jar` in Terminal.
               - Linux: Run `java -jar forge-installer-*.jar` in Terminal.
            4. Choose an install folder and let the installer unpack all required files for you.
            5. Launch Forge from the installed folder:
               - Windows: `forge.exe`
               - macOS/Linux: `./forge.sh`
            6. In the main menu (left side), select "Rogue Commander" and click "Start New Run" to begin the game mode.

            This is a development build for playtesting the new Rogue Commander game mode, which is still a work in progress.
            For general information on how to use the Forge app and gameplay basics, see the [official Forge User Guide](https://github.com/Card-Forge/forge/wiki/User-Guide#gameplay).

  build-windows-setup:
    needs: [build]
    if: github.ref == 'refs/heads/rogueCommander'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download Temurin 17 JRE (Windows x64)
        shell: pwsh
        run: |
          $jreUrl = "https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jre/hotspot/normal/eclipse"
          Write-Host "Downloading Temurin 17 JRE from Adoptium..."
          Invoke-WebRequest -Uri $jreUrl -OutFile jre.zip -UseBasicParsing
          Write-Host "Download complete. Extracting..."
          Expand-Archive -Path jre.zip -DestinationPath jre-raw
          $extracted = Get-ChildItem jre-raw | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          Write-Host "Extracted folder: $($extracted.Name) — renaming to jre17"
          Rename-Item $extracted.FullName -NewName "jre17"
          if (-not (Test-Path "jre-raw\jre17\bin\java.exe")) { throw "java.exe not found at expected path" }
          $jreSize = [math]::Round((Get-ChildItem "jre-raw\jre17" -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "JRE ready at jre-raw\jre17 ($jreSize MB total)"

      - name: Generate Inno Setup script
        shell: pwsh
        env:
          FORGE_VERSION: ${{ needs.build.outputs.version }}
          JAR_URL: https://github.com/bennybenedek/forge/releases/download/rogue-commander-latest/forge-installer-${{ needs.build.outputs.version }}.jar
        run: |
          $version = $env:FORGE_VERSION
          $jarUrl  = $env:JAR_URL
          Write-Host "Generating ISS for version: $version"
          Write-Host "JAR URL: $jarUrl"

          $iss = @"
          [Setup]
          AppId={{A1B2C3D4-E5F6-7890-ABCD-EF1234567890}
          AppName=Forge Rogue Commander Installer
          AppVersion=$version
          AppPublisherURL=https://github.com/bennybenedek/forge
          DefaultDirName={tmp}\forge-bootstrap
          DisableDirPage=yes
          DisableProgramGroupPage=yes
          OutputBaseFilename=forge-rogue-commander-setup
          OutputDir=.
          Compression=lzma2/ultra64
          SolidCompression=yes
          PrivilegesRequired=lowest
          ArchitecturesInstallIn64BitMode=x64
          WizardStyle=modern
          CreateUninstallRegKey=no
          Uninstallable=no

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Files]
          Source: "jre-raw\jre17\*"; DestDir: "{tmp}\forge-bootstrap\jre17"; Flags: recursesubdirs createallsubdirs ignoreversion

          [Run]
          Filename: "powershell.exe"; Parameters: "-NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ""`$ProgressPreference='SilentlyContinue'; Invoke-WebRequest -Uri '$jarUrl' -OutFile '{tmp}\forge-installer.jar' -UseBasicParsing"""; StatusMsg: "Downloading Forge installer (~500 MB, please wait)..."; Flags: runhidden waituntilterminated
          Filename: "{tmp}\forge-bootstrap\jre17\bin\java.exe"; Parameters: "-jar ""{tmp}\forge-installer.jar"""; StatusMsg: "Launching Forge installer wizard..."; Flags: waituntilterminated
          "@

          [System.IO.File]::WriteAllText("$PWD\forge-bootstrapper.iss", $iss, [System.Text.UTF8Encoding]::new($false))
          Write-Host "--- Generated forge-bootstrapper.iss ---"
          Get-Content forge-bootstrapper.iss

      - name: Compile Inno Setup script
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          Write-Host "Compiling with ISCC: $iscc"
          & $iscc forge-bootstrapper.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "forge-rogue-commander-setup.exe")) { throw "EXE not produced — check ISCC output above" }
          $mb = [math]::Round((Get-Item "forge-rogue-commander-setup.exe").Length / 1MB, 1)
          Write-Host "forge-rogue-commander-setup.exe produced ($mb MB)"

      - name: Upload EXE to Rogue Commander release
        uses: ncipollo/release-action@v1
        with:
          tag: rogue-commander-latest
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          removeArtifacts: false
          artifacts: forge-rogue-commander-setup.exe
          token: ${{ secrets.GITHUB_TOKEN }}
